name: CI

# Validation pipeline for the Mozhi Next.js app (frontend + API route handlers).
# Deployment is intentionally NOT wired up yet - see the commented `deploy` job at
# the bottom once a hosting target is chosen.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# A new push to the same branch supersedes the previous run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  validate:
    name: Lint, typecheck & build
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      # next@16 requires Node >=20.9. 22 is the active LTS and matches local dev.
      - name: Set up Node.js 22
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies (npm ci, from package-lock.json)
        run: npm ci

      # Next.js caches compiler output here; restoring it cuts build time and
      # silences the "No build cache found" warning. Keyed on source so that a
      # source change reuses the nearest previous cache instead of starting cold.
      - name: Restore Next.js build cache
        uses: actions/cache@v6
        with:
          path: .next/cache
          key: ${{ runner.os }}-next-${{ hashFiles('package-lock.json') }}-${{ hashFiles('src/**/*.[jt]s', 'src/**/*.[jt]sx') }}
          restore-keys: |
            ${{ runner.os }}-next-${{ hashFiles('package-lock.json') }}-

      # next-env.d.ts and the route-aware type helpers (PageProps, RouteContext)
      # are generated, not committed, so they must exist before `tsc` runs.
      - name: Generate Next.js route types
        run: npx next typegen

      - name: Type-check (tsc --noEmit)
        run: npx tsc --noEmit

      # `next build` does NOT run ESLint, so lint is its own step.
      - name: Lint (ESLint)
        run: npm run lint

      # Node's built-in test runner over the .ts sources; no test framework to install.
      # Covers upload-path signing, the size/format rules and response-shape parsing.
      - name: Unit tests (node --test)
        run: npm test

      # Compiles pages and all /api route handlers. Needs no secrets: every env read in
      # src/lib/supabase.ts, src/lib/sarvam.ts and src/lib/upload-token.ts happens lazily
      # inside a function at request time, never at module scope.
      - name: Build Next.js application
        run: npm run build

# ---------------------------------------------------------------------------
# Deployment (not enabled - no hosting target confirmed yet).
